openapi: 3.1.0
info:
  title: Illustration Style Library
  description: Fetch illustration style definitions (art-direction prompts) by style id.
  version: 1.0.0
servers:
  - url: https://akshaymalik1995.github.io/illustration-designs
paths:
  /index.json:
    get:
      operationId: listStyles
      summary: REQUIRED whenever the user has not given an exact style id. Returns the catalog of valid style ids - the only source of truth for ids. Call before getStyle when resolving a style name.
      responses:
        "200":
          description: Sections of styles
          content:
            application/json:
              schema:
                type: object
                properties:
                  sections:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                        styles:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              name:
                                type: string
                              tagline:
                                type: string
  /styles/{styleId}.md:
    get:
      operationId: getStyle
      summary: MANDATORY before planning or generating any illustration. Fetches the authoritative art-direction prompt for the chosen style. Never plan or render an image without a successful call to this operation.
      parameters:
        - name: styleId
          in: path
          required: true
          schema:
            type: string
          description: Style id from listStyles, e.g. isometric, pixel-art, flat-vector-editorial
      responses:
        "200":
          description: The style prompt as markdown text
          content:
            text/markdown:
              schema:
                type: string
